[project]
name = "sa-research-os"
version = "0.1.0"
description = "Point-in-time quantitative research engineering modules"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26.0", "scipy>=1.12.0"]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[tool.setuptools.packages.find]
include = ["alpha_research_os*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
